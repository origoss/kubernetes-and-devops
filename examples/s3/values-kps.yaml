# Slim kube-prometheus-stack for a laptop kind cluster.
fullnameOverride: kps
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
# kind does not expose these control-plane endpoints; their targets would show as down.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
grafana:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
