apiVersion: v1
kind: ConfigMap
metadata:
  name: plain-prometheus
  namespace: plain
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-prometheus
  namespace: plain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plain-prometheus
  template:
    metadata:
      labels:
        app: plain-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: plain-prometheus
